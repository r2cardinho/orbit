<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Orbit logo: three people linked in an equilateral triangle, on a transparent background.
       A favicon cannot read CSS, so the color is copied from tokens.css: #9d8cff is the accent purple.
       (XML comments cannot contain two hyphens in a row, so the token name is not written here.) -->
  <path d="M16 6 7.34 21 24.66 21Z" fill="none" stroke="#9d8cff" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="16" cy="6" r="4.5" fill="#9d8cff"/>
  <circle cx="7.34" cy="21" r="4.5" fill="#9d8cff"/>
  <circle cx="24.66" cy="21" r="4.5" fill="#9d8cff"/>
</svg>
